<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - EcoBuild</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page">

    <div class="login-container">

        <div class="login-card">

            <div class="logo-login">
                EcoBuild
            </div>

            <h1>
                Entrar
            </h1>

            <p class="subtitulo">
                Acesse sua conta
            </p>


            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>


                <p
                    id="mensagem"
                    class="mensagem"
                ></p>

            </form>


            <p>
                Não possui uma conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </div>

    </div>


    <script src="../js/api.js"></script>

    <script src="../js/login.js"></script>

</body>

</html>
