<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - EcoBuild</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page">

    <div class="login-container">

        <div class="login-card">

            <div class="logo-login">
                EcoBuild
            </div>

            <h1>
                Criar conta
            </h1>

            <p class="subtitulo">
                Crie sua conta para começar
            </p>

            <form id="cadastroForm">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Criar conta
                </button>

                <p
                    id="mensagem"
                    class="mensagem"
                ></p>

            </form>

            <p>
                Já possui uma conta?
                <a href="login.html">
                    Fazer login
                </a>
            </p>

        </div>

    </div>

    <script src="../js/api.js"></script>

    <script src="../js/cadastro.js"></script>

</body>

</html>
