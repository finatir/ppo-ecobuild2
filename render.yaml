databases:
  - name: ecobuild-db
    plan: free
    region: oregon
    databaseName: ecobuild
    user: ecobuild_user
    postgresMajorVersion: "18"

services:
  - type: web
    name: ecobuild
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecobuild-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
